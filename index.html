header h1{font-size:17px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px}header small{display:block;color:var(--m);font-weight:400;font-size:12px}
main{max-width:1040px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:22px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
h2{font-size:20px;margin:0 0 10px;font-weight:800;letter-spacing:-.4px}h3{font-size:15px;margin:0 0 8px}
input,select,textarea,button{font:inherit;min-height:42px;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:12px;padding:9px 12px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--a)}
button{cursor:pointer;transition:.15s}button:hover{transform:translateY(-1px)}
button.p{background:linear-gradient(120deg,var(--a),#7dff9a);color:var(--on);border:0;font-weight:700}button.d{color:var(--k)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.row>input,.row>select{flex:1;min-width:120px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin-bottom:14px;flex-wrap:wrap}.tabs button{border-radius:30px;white-space:nowrap;flex:none}@media(max-width:600px){main{padding:10px}.card{padding:12px;border-radius:18px}header h1{font-size:15px}}.tabs button.on{background:var(--t);color:var(--bg);border-color:var(--t)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);font-size:14px}th{color:var(--m);font-weight:600}
